<section id="$idprefix$title-slide"$for(title-slide-attributes/pairs)$ $it.key$="$it.value$"$endfor$>
  <h1 class="title">$title$</h1>
$if(subtitle)$
  <p class="subtitle">$subtitle$</p>
$endif$
$for(author)$
  <p class="author">$author$</p>
$endfor$
$for(institute)$
  <p class="institute">$institute$</p>
$endfor$
$if(date)$
  <p class="date">$date$</p>
$endif$
  <div class="title-charts" aria-hidden="true">

    <svg class="title-chart" viewBox="0 0 140 70" preserveAspectRatio="xMidYMax meet">
      <line class="title-chart-grey" x1="15" y1="42" x2="125" y2="18" stroke-width="1.5" />
      <line class="title-chart-grey" x1="15" y1="24" x2="125" y2="38" stroke-width="1.5" />
      <line class="title-chart-grey" x1="15" y1="33" x2="125" y2="50" stroke-width="1.5" />
      <line class="title-chart-highlight" x1="15" y1="58" x2="125" y2="12" stroke-width="3" />
      <line class="title-chart-grey" x1="15" y1="48" x2="125" y2="60" stroke-width="1.5" />
      <circle class="title-chart-grey" cx="15" cy="42" r="2.2" />
      <circle class="title-chart-grey" cx="125" cy="18" r="2.2" />
      <circle class="title-chart-grey" cx="15" cy="24" r="2.2" />
      <circle class="title-chart-grey" cx="125" cy="38" r="2.2" />
      <circle class="title-chart-grey" cx="15" cy="33" r="2.2" />
      <circle class="title-chart-grey" cx="125" cy="50" r="2.2" />
      <circle class="title-chart-highlight" cx="15" cy="58" r="2.6" />
      <circle class="title-chart-highlight" cx="125" cy="12" r="2.6" />
      <circle class="title-chart-grey" cx="15" cy="48" r="2.2" />
      <circle class="title-chart-grey" cx="125" cy="60" r="2.2" />

    <svg class="title-chart" viewBox="0 0 140 70" preserveAspectRatio="xMidYMax meet">
      <rect class="title-chart-highlight" x="0" y="4" width="130" height="9" />
      <rect class="title-chart-grey" x="0" y="18" width="102" height="9" />
      <rect class="title-chart-grey" x="0" y="32" width="72" height="9" />
      <rect class="title-chart-grey" x="0" y="46" width="55" height="9" />
      <rect class="title-chart-grey" x="0" y="60" width="40" height="9" />
    </svg>

    <svg class="title-chart" viewBox="0 0 140 70" preserveAspectRatio="xMidYMax meet">
      <polyline class="title-chart-line" points="10,45 50,35 90,50 130,38" fill="none" stroke-width="1.6" />
      <polyline class="title-chart-line" points="10,25 50,40 90,20 130,45" fill="none" stroke-width="1.6" />
      <polyline class="title-chart-line" points="10,15 50,20 90,10 130,25" fill="none" stroke-width="1.6" />
      <polyline class="title-chart-line-highlight" points="10,58 50,40 90,25 130,15" fill="none" stroke-width="3" />
    </svg>

    <svg class="title-chart" viewBox="0 0 140 70" preserveAspectRatio="xMidYMax meet">
      <line class="title-chart-line" x1="45" y1="10" x2="45" y2="22" stroke-width="1.4" />
      <line class="title-chart-line" x1="45" y1="48" x2="45" y2="60" stroke-width="1.4" />

      <line class="title-chart-line" x1="83" y1="27" x2="107" y2="27" stroke-width="1.8" />

  </div>
</section>
